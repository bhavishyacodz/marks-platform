name: MARKS quality checks

on:
  push:
    branches: [feat/question-quality-audit-gate]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marks-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and evidence audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run lint
        run: npm run lint

      - name: Test question-quality evidence audit
        run: npm run test:question-quality

      - name: Run question-quality evidence audit
        run: npm run audit:question-quality:strict

      - name: Build production app
        run: npm run build
