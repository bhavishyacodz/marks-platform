name: Import JEE PDF pair (review draft)

on:
  workflow_dispatch:
    inputs:
      paper_path:
        description: Repository path to the question paper PDF
        required: true
        default: data/source-papers/JEE-Main-2026-Question-Paper-B-Tech-2nd-Apr-Shift-2.pdf
        type: string
      key_path:
        description: Optional repository path to a matching final answer key PDF; leave default to download the official Session-II final key
        required: true
        default: data/source-papers/REPLACE-WITH-MATCHING-FINAL-KEY.pdf
        type: string
      label:
        description: Label for the generated review draft
        required: true
        default: 2026-04-02-shift-2
        type: string

permissions:
  contents: read

jobs:
  import-review-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: python -m pip install --upgrade pip pymupdf

      - name: Download official Session-II final answer key when no local key is selected
        if: inputs.key_path == 'data/source-papers/REPLACE-WITH-MATCHING-FINAL-KEY.pdf'
        run: |
          mkdir -p data/import/downloads
          curl --fail --location --retry 3 \
            "https://cdnbbs.s3waas.gov.in/s3f8e59f4b2fe7c5705bf878bbd494ccdf/uploads/2026/04/20260420409057044.pdf" \
            --output data/import/downloads/jee-main-2026-session-2-final-answer-key.pdf
          test -s data/import/downloads/jee-main-2026-session-2-final-answer-key.pdf
          echo "KEY_PATH=data/import/downloads/jee-main-2026-session-2-final-answer-key.pdf" >> "$GITHUB_ENV"

      - name: Validate input paths
        env:
          PAPER_PATH: ${{ inputs.paper_path }}
          INPUT_KEY_PATH: ${{ inputs.key_path }}
        run: |
          test -f "$PAPER_PATH" || { echo "Question paper not found: $PAPER_PATH"; exit 1; }
          if [ "$INPUT_KEY_PATH" = "data/source-papers/REPLACE-WITH-MATCHING-FINAL-KEY.pdf" ]; then
            test -s "data/import/downloads/jee-main-2026-session-2-final-answer-key.pdf" || { echo "Official final key download failed"; exit 1; }
          else
            test -f "$INPUT_KEY_PATH" || { echo "Answer key not found: $INPUT_KEY_PATH"; exit 1; }
            echo "KEY_PATH=$INPUT_KEY_PATH" >> "$GITHUB_ENV"
          fi
          case "$PAPER_PATH" in *.pdf|*.PDF) ;; *) echo "Paper must be a PDF"; exit 1;; esac

      - name: Generate review-only draft
        env:
          PAPER_PATH: ${{ inputs.paper_path }}
          KEY_PATH: ${{ inputs.key_path }}
          LABEL: ${{ inputs.label }}
        run: |
          python scripts/import-jee-pdf-pair.py \
            --paper "$PAPER_PATH" \
            --key "$KEY_PATH" \
            --label "$LABEL" \
            --out data/import/review-drafts

      - name: Upload review draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-import-review-draft
          path: data/import/review-drafts/*.json
          if-no-files-found: error
          retention-days: 14
