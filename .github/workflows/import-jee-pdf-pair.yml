name: Import JEE PDF pair (review draft)

on:
  push:
    branches:
      - feat/question-quality-audit-gate
    paths:
      - '.github/workflows/import-jee-pdf-pair.yml'
      - 'scripts/import-jee-pdf-pair.py'
      - 'scripts/build-import-review-report.py'
      - 'data/source-papers/JEE-Main-2026-Question-Paper-B-Tech-2nd-Apr-Shift-2.pdf'
      - 'data/source-papers/2026 jee mains answer key session 2.pdf'
  workflow_dispatch:
    inputs:
      paper_path:
        description: Repository path to the question paper PDF
        required: true
        default: data/source-papers/JEE-Main-2026-Question-Paper-B-Tech-2nd-Apr-Shift-2.pdf
        type: string
      key_path:
        description: Repository path to the matching final answer key PDF already stored in the repository
        required: true
        default: data/source-papers/2026 jee mains answer key session 2.pdf
        type: string
      label:
        description: Label for the generated review draft
        required: true
        default: 2026-04-02-shift-2
        type: string

permissions:
  contents: read

jobs:
  import-review-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes tesseract-ocr

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PDF parser
        run: python -m pip install --upgrade pip pymupdf

      - name: Validate input paths
        env:
          PAPER_PATH: ${{ inputs.paper_path || 'data/source-papers/JEE-Main-2026-Question-Paper-B-Tech-2nd-Apr-Shift-2.pdf' }}
          KEY_PATH: ${{ inputs.key_path || 'data/source-papers/2026 jee mains answer key session 2.pdf' }}
        run: |
          test -f "$PAPER_PATH" || { echo "Question paper not found: $PAPER_PATH"; exit 1; }
          test -f "$KEY_PATH" || { echo "Answer key not found: $KEY_PATH"; exit 1; }
          case "$PAPER_PATH" in *.pdf|*.PDF) ;; *) echo "Paper must be a PDF"; exit 1;; esac
          case "$KEY_PATH" in *.pdf|*.PDF) ;; *) echo "Answer key must be a PDF"; exit 1;; esac

      - name: Generate review-only draft
        env:
          PAPER_PATH: ${{ inputs.paper_path || 'data/source-papers/JEE-Main-2026-Question-Paper-B-Tech-2nd-Apr-Shift-2.pdf' }}
          KEY_PATH: ${{ inputs.key_path || 'data/source-papers/2026 jee mains answer key session 2.pdf' }}
          LABEL: ${{ inputs.label || '2026-04-02-shift-2' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python scripts/import-jee-pdf-pair.py \
            --paper "$PAPER_PATH" \
            --key "$KEY_PATH" \
            --label "$LABEL" \
            --out data/import/review-drafts

      - name: Validate draft metadata and answer-key extraction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path("data/import/review-drafts").glob("*.json"))
          if len(files) != 1:
              raise SystemExit(f"Expected exactly one review draft, found {len(files)}")
          data = json.loads(files[0].read_text(encoding="utf-8"))
          summary = data.get("summary", {})
          exam = data.get("exam", {})
          if summary.get("sourceMismatch") or data.get("status") == "blocked-source-mismatch":
              raise SystemExit("BLOCKED: answer-key date/shift did not match the requested paper.")
          if not exam.get("dateFromKey") or not exam.get("shiftFromKey"):
              raise SystemExit("BLOCKED: answer-key date/shift metadata is missing.")
          if summary.get("keyCandidatePairs", 0) < 1:
              raise SystemExit("BLOCKED: no answer-key pairs were extracted.")
          questions = data.get("questions", [])
          ids = [q.get("questionId") for q in questions if q.get("questionId")]
          if len(ids) != len(set(ids)):
              raise SystemExit("BLOCKED: duplicate question IDs were extracted.")
          allowed_statuses = {
              "question-id-match-needs-human-review", "ambiguous-key-id",
              "no-key-id-match", "blocked-source-mismatch",
          }
          invalid_review_states = [
              q.get("questionNumber") for q in questions
              if q.get("needsHumanReview") is not True
              or q.get("answerKeyMatchStatus") not in allowed_statuses
          ]
          if invalid_review_states:
              raise SystemExit(f"BLOCKED: candidates missing safe review-only status: {invalid_review_states}")
          false_answer_claims = [
              q.get("questionNumber") for q in questions
              if q.get("answerKeyMatchStatus") != "question-id-match-needs-human-review"
              and q.get("answerKeyCandidateOptionId") is not None
          ]
          if false_answer_claims:
              raise SystemExit(f"BLOCKED: option attached without unique ID candidate match: {false_answer_claims}")
          invalid_option_flags = [
              q.get("questionNumber") for q in questions
              if q.get("questionType") == "SA" and "options_not_detected" in q.get("reviewFlags", [])
          ]
          if invalid_option_flags:
              raise SystemExit(f"BLOCKED: numerical-answer questions incorrectly flagged as MCQ: {invalid_option_flags}")
          mcq_missing_options = [
              q.get("questionNumber") for q in questions
              if q.get("questionType") == "MCQ" and (
                  "options_not_detected" in q.get("reviewFlags", [])
                  or "option_content_may_be_missing_or_ocr_incomplete" in q.get("reviewFlags", [])
              )
          ]
          review_root = Path("data/import/review-drafts").resolve()
          missing_source_images, unsafe_source_images = [], []
          for q in questions:
              image_ref = q.get("originalPageImage")
              if not image_ref:
                  missing_source_images.append(q.get("questionNumber"))
                  continue
              image_path = (review_root / image_ref).resolve()
              if not image_path.is_relative_to(review_root):
                  unsafe_source_images.append(q.get("questionNumber"))
              elif not image_path.is_file():
                  missing_source_images.append(q.get("questionNumber"))
          missing_source_refs = [q.get("questionNumber") for q in questions if not q.get("sourcePageRef")]
          if unsafe_source_images:
              raise SystemExit(f"BLOCKED: source image path escapes artifact folder: {unsafe_source_images}")
          if missing_source_images:
              raise SystemExit(f"BLOCKED: original page image missing: {missing_source_images}")
          if missing_source_refs:
              raise SystemExit(f"BLOCKED: source page reference missing: {missing_source_refs}")
          print(f"Validated metadata: {exam['dateFromKey']} shift {exam['shiftFromKey']}")
          print(f"Question candidates: {len(questions)}; unique IDs: {len(set(ids))}")
          print(f"MCQ candidates needing option review: {mcq_missing_options}")
          print(f"Review-only answer-key pairs: {summary['keyCandidatePairs']}")
          print("Reminder: no answers are verified or published.")
          PY

      - name: Build side-by-side HTML review report
        run: |
          draft="$(find data/import/review-drafts -maxdepth 1 -type f -name '*.json' -print -quit)"
          python scripts/build-import-review-report.py \
            --input "$draft" \
            --output data/import/review-drafts/review-report.html

      - name: Upload review draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: jee-import-review-draft
          path: data/import/review-drafts/**
          if-no-files-found: error
          retention-days: 14
